spring.application.name=s4s-gateway

# Default profile
spring.profiles.active=
spring.profiles.group.sender=sender,filtersample1
#spring.profiles.group.receiver=receiver,tls-in-on,tls-out-on,filtersample1
spring.profiles.group.receiver=receiver,filtersample1
spring.profiles.group.docker=docker

### Logging Configuration
# Set logging level for the root logger
logging.level.root=INFO
logging.level.de.fraunhofer.aisec.s4sgateway=DEBUG
# Set logging level for a specific package or class
#logging.level.com.example.loggingdemo=DEBUG
# Set the logging pattern
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Set CONDITIONS EVALUATION REPORT on (DEBUG) or off (INFO)
logging.level.org.springframework.boot.autoconfigure=INFO

# Enable logging to a file
logging.file.name=logs/spring-boot-app.log
# Maximum file size before rolling over
logging.file.max-size=10MB
# Total size of all log files
logging.file.total-size-cap=50MB

### Default values
relevantHeaders={'content-type','accept','user-Agent','accept-Encoding','safe4soc-receiver-hostname','safe4soc-receiver-port'}
# Schema path is in src/main/resources if launched in intellij
IDMEFv2SchemaPath=/schemas/idmefv2-schema.json

### Default Settings Incoming TLS off http only
# The following settings are overwritten by the corresponding config profiles tls-in-on
server.ssl.enabled=false
server.ssl.key-store=""
server.ssl.key-store-password=""
server.ssl.key-store-type= PKCS12
server.ssl.key-alias= ""

server.ssl.trust-store= ""
server.ssl.trust-store-password= ""
server.ssl.trust-store-type= PKCS12

### Default Settings Outgoing TLS off http only
# The following settings are overwritten by the corresponding config profiles tls-out-on
# Values for internal SSL Context of Java, not VM
# Activate SSL for outgoing connections
gatewayProtocol=http
sslOutboundActivated=false
trustStorePassword=""
trustStorePath=""
# Activate for mTLS
#server.ssl.client-auth= ${SSL_MTLS_SETTING}
keyStorePath=""
keyStorePassword=""

gatewayReceiverURL=""
gatewayReceiverUsername=""
gatewayReceiverPassword=""
kafkaTopic=alerts

