	renderers = [
			new com.github.jk1.license.render.JsonReportRenderer(),
			new com.github.jk1.license.render.CsvReportRenderer()
	]
}
*/

sourceSets {
	main {
		resources {
			srcDirs = ['src/main/resources']
			includes = ['**/*']
		}
	}
}