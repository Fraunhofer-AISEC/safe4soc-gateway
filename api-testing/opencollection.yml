opencollection: 1.0.0

info:
  name: SAFE4SOC IS-GW API
  version: 3.0.1
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
  clientCertificates:
    - domain: "{{HOSTNAME}}"
      type: pkcs12
      pkcs12FilePath: ..\pki-test\mtls-certs\gateway-receiver\keystore.p12
      passphrase: password

docs:
  content: This is the Bruno Client's collection for the GitHub project <https://fraunhofer-aisec.github.io/safe4soc-gateway/>
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
      defaultEnvironment: local http (insecure)
