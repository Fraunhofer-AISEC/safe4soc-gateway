info:
  name: Status (GW-RC)
  type: http
  seq: 1

http:
  method: GET
  url: "{{PROTOCOL}}://{{HOSTNAME}}:{{RECEIVER_PORT}}/status"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: This API has the purpose to trigger a heartbeat from the gateway under test.
