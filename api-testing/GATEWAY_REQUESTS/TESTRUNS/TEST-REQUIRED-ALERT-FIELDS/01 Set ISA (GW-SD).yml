info:
  name: Set ISA (GW-SD)
  type: http
  seq: 1

http:
  method: POST
  url: "{{PROTOCOL}}://{{HOSTNAME}}:{{SENDER_PORT}}/setisa"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "requiredConfig": {
          "OrganisationName": "",
          "Analyzer": {
            "Name": ""
          }
        },
        "enrichmentConfig": {},
        "dropConfig": {},
        "filterConfig": {}
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("The gateway accepted the scenario ISA", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.equal("Processed ISA update.");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  Install the policy used by the following requests. Run only against a dedicated test gateway.
