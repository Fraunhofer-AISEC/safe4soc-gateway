info:
  name: Missing nested analyzer name
  type: http
  seq: 4

http:
  method: POST
  url: "{{PROTOCOL}}://{{HOSTNAME}}:{{SENDER_PORT}}/topics/{{KAFKE_TOPIC}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "Version": "2.D.V09",
        "ID": "550e8400-e29b-41d4-a716-000000000902",
        "CreateTime": "2026-11-24T10:00:00Z",
        "Analyzer": {},
        "OrganisationName": "Example SOC"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("The gateway rejects the alert for the expected reason", function () {
          expect(res.getStatus()).to.equal(422);
          expect(res.getBody()).to.include("missing mandatory field Analyzer");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  The Analyzer object exists without the ISA-required Name property.
