info:
  name: ISA Check (GW-SD)
  type: http
  seq: 2

http:
  method: POST
  url: "{{PROTOCOL}}://{{HOSTNAME}}:{{SENDER_PORT}}/isacheck"
  body:
    type: json
    data: |-
      {
        "provider_reason": "compliance",
        "intended_use": "alert_gathering",
        "data_usage_policies": {
          "use_until": "2024-12-12",
          "use_after": "2024-09-12",
          "share_further": "false"
        },
        "data_sender_SIEM_brand": "Example Company A",
        "data_sender_SIEM_version": "Version 0.1",
        "IDMEFv2_attributes": {
          "attributes_to_transmit": [],
          "attributes_to_neglect": [],
          "attributes_to_anonymize": [],
          "attributes_to_pseudonemize": []
        },
        "sending_mode": "realtime",
        "encryption_requirements": [],
        "authentication_requirements": [],
        "connection_requirements": []
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: This API has the purpose to test whether the ISA is loaded, which is contained in this request.
